                            </svg>
                            <span>Войти</span>
                        </button>
                        <p-dialog header="Авторизация" [modal]="true" [(visible)]="visible" [style]="{ width: '26rem' }"
                            styleClass="dialog-close-button">

                            <ng-template #header>
                                <h4 class="dialog-title">Авторизация</h4>
                            </ng-template>

                            <div class="dialog-main">
                                <input type="text" pInputText formControlName="text" placeholder="Номер телефона" />

                                <form [formGroup]="formGroup">
                                    <p-password formControlName="value" [feedback]="false" placeholder="Пароль" />
                                    <!-- <label for="on_label">Введите пароль</label> -->
                                </form>
                            </div>

                            <ng-template #footer>
                                <p-button label="Войти" />
                            </ng-template>

                        </p-dialog>
                    </div>
